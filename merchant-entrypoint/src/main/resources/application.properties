# Quarkus Datasource configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:ojassurpatne}
quarkus.datasource.password=${DB_PASSWORD:password}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/paypulse}

# Hibernate ORM configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=false

quarkus.liquibase.change-log=db.changelog/master.xml
quarkus.liquibase.migrate-at-start=true

# Loads the Kafka/messaging keys from a dedicated file (see messaging.properties)
quarkus.config.locations=messaging.properties

# HTTP server
quarkus.http.port=${HTTP_PORT:8080}

# Health/readiness (§8) — this service is called synchronously by transaction-service
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.liveness-path=/live
quarkus.smallrye-health.readiness-path=/ready

# Swagger UI and OpenAPI configuration
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/merchant/swagger-ui
quarkus.smallrye-openapi.path=/openapi