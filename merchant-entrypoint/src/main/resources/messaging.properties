# Kafka / messaging configuration (§2, §5)
# Values are supplied by environment variables exported from env.sh (source env.sh)
# and referenced via Quarkus env-var placeholders.

mp.messaging.outgoing.merchant-registered.connector=smallrye-kafka
mp.messaging.outgoing.merchant-registered.topic=${TOPIC_MERCHANT_REGISTERED:paypulse.merchant.registered.v1}

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Outbox relay (§5)
outbox.relay.interval=${OUTBOX_RELAY_INTERVAL:5s}
outbox.relay.batch-size=50
outbox.relay.publish-timeout=3s
