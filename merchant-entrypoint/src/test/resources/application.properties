quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:paypulse;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Schema in tests is driven by Hibernate drop-and-create; Liquibase stays for real environments
quarkus.liquibase.migrate-at-start=false

# Keep tests hermetic: no Kafka connection attempts from the outbox relay
quarkus.scheduler.enabled=false

# Disable the outgoing Kafka channel in tests so no producer is constructed
# (bootstrap.servers is only provided by messaging.properties in run profiles).
mp.messaging.outgoing.merchant-registered.enabled=false
